name: GameLingo focused quality checkpoint
on:
  push:
    branches: ['codex/quality-fixes-1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Source, project and packaging checks
        run: |
          python3 iOS/Scripts/validate-source.py
          python3 iOS/Scripts/test-build-tools.py
          python3 tools/pack_converter/test_converter.py
          find iOS/GameLingo -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
      - name: All portable Swift tests, including the current quality unit
        working-directory: iOS
        run: swift test --parallel
