name: GameLingo focused quality checkpoint
on:
  push:
    branches: ['codex/quality-fixes-1', 'codex/play-experience-preview']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-checkpoint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    # Portable package checks need no Apple SDK. Final iOS native/Simulator
    # verification still runs with Xcode 16.4 in ios-build.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Source, project and packaging checks
        run: |
          python3 iOS/Scripts/validate-source.py
          python3 iOS/Scripts/test-build-tools.py
          python3 iOS/Scripts/test-test-orchestration.py
          python3 iOS/Scripts/test-preview-gates.py
          python3 tools/pack_converter/test_converter.py
          swift --version
          find iOS/GameLingo -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
      - name: All portable Swift tests, including the current quality unit
        working-directory: iOS
        run: swift test --parallel
      - name: Compare real post-OCR Core with the approved Release
        run: python3 iOS/Benchmarks/benchmark-quality.py
