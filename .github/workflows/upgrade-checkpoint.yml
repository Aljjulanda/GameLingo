name: GameLingo 0.5 core and TV
on:
  push:
    branches: ['codex/gamelingo-0.5.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: python3 iOS/Scripts/validate-source.py
      - run: swift test --package-path iOS
  television:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: gradle -p android-tv --console plain :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: GameLingo-TV-0.5.0-APK
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: GameLingo-TV-tests
          path: android-tv/app/build/reports/tests/testDebugUnitTest
