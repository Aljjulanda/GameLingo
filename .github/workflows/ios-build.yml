name: GameLingo iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: 'Approved preview defers Vision/Files hardware acceptance and excludes production typewriter'
        type: choice
        default: full
        options: ['quality-preview-1', 'full']
      runner:
        description: 'Mac architecture only; Xcode stays 16.4'
        type: choice
        default: macos-15-intel
        options: ['macos-15-intel', 'macos-15']
  push:
    branches: ['main', 'codex/**', '!codex/quality-fixes-1', '!codex/play-experience-preview']
    paths: ['iOS/**', 'tools/pack_converter/**', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['iOS/**', 'tools/pack_converter/**', '.github/workflows/ios-build.yml']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: gamelingo-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Approved preview keeps archive/Core/native non-Vision gates.
    # Full Vision/Files tests remain available; no ignored failures.
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reproduce LAN listener binding and endpoint representation
        run: swift iOS/Scripts/probe-lan.swift
      - name: Record approved preview scope and toolchain
        if: ${{ inputs.validation_profile == 'quality-preview-1' }}
        run: |
          test "$(uname -m)" = x86_64
          xcodebuild -version | tee /tmp/gamelingo-xcode-version.txt
          grep -q '^Xcode 16.4$' /tmp/gamelingo-xcode-version.txt
          python3 iOS/Scripts/preview-tests.py filters
          mkdir -p iOS/build/logs
          python3 -c 'import json,os,platform,subprocess; from pathlib import Path; Path("iOS/build/logs/preview-environment.json").write_text(json.dumps(dict(profile="quality-preview-1",source_commit=os.environ["GITHUB_SHA"],architecture=platform.machine(),runner="macos-15-intel",xcode=subprocess.check_output(["xcodebuild","-version"],text=True)),indent=2))'
      - name: Install native build dependencies
        run: brew install cmake ninja protobuf
      - name: Restore native dependency build cache
        id: native-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            iOS/.build/sources
            iOS/.build/native
            iOS/.build/lib
            iOS/.build/include
          key: ios-native-xcode16.4-${{ runner.arch }}-${{ hashFiles('iOS/Scripts/bootstrap.py', 'iOS/Scripts/build-native.sh', 'iOS/Scripts/combine-libraries.py', 'iOS/Native/GLRemotePlay.c', 'iOS/Native/GLRemotePlay.h') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-native-xcode16.4-${{ runner.arch }}-${{ hashFiles('iOS/Scripts/bootstrap.py', 'iOS/Scripts/build-native.sh', 'iOS/Scripts/combine-libraries.py', 'iOS/Native/GLRemotePlay.c', 'iOS/Native/GLRemotePlay.h') }}-
            ios-native-xcode16.4-${{ runner.arch }}-
            ios-native-xcode16.4-
      - name: Validate source and preserve existing platform implementations
        run: |
          python3 tools/pack_converter/test_converter.py
          python3 iOS/Scripts/validate-source.py
          python3 iOS/Scripts/test-build-tools.py
          python3 iOS/Scripts/test-test-orchestration.py
          python3 iOS/Scripts/test-preview-gates.py
      - name: Test portable Swift dialogue and protocol logic
        working-directory: iOS
        run: |
          mkdir -p build/logs
          swift test --parallel 2>&1 | tee build/logs/core-tests.log
      - name: Validate real RDR2 data with native SQLite without publishing localization
        run: python3 tools/pack_converter/validate-real-rdr2.py
      - name: Prepare pinned dependencies and native iPhone libraries
        run: bash iOS/Scripts/prepare.sh 2>&1 | tee prepare.log
      - name: Compare bounded maintenance tracker with accepted baseline
        run: |
          git fetch --depth=1 origin tag stable/real-device-0.2.0
          python3 iOS/Benchmarks/benchmark-maintenance.py
      - name: Compare post-OCR behavior and latency with approved Release
        run: python3 iOS/Benchmarks/benchmark-quality.py
      - name: Validate Apple project
        run: |
          plutil -lint iOS/GameLingo/Resources/Info.plist
          plutil -lint iOS/GameLingo/Resources/PrivacyInfo.xcprivacy
          plutil -lint iOS/GameLingo.xcodeproj/project.pbxproj
      - name: Archive and package unsigned IPA
        run: bash iOS/Scripts/build-unsigned.sh
      - name: Core and Apple integration tests
        if: ${{ inputs.validation_profile != 'quality-preview-1' }}
        env:
          SKIP_CORE_TESTS: '1'
        run: bash iOS/Scripts/test.sh
      - name: Approved preview native Argos SQLite import names corrections and WSS gates
        if: ${{ inputs.validation_profile == 'quality-preview-1' }}
        env:
          SKIP_CORE_TESTS: '1'
          IOS_PREVIEW: '1'
        run: bash iOS/Scripts/test.sh
      - name: Native Files picker selection and sandbox import
        if: ${{ inputs.validation_profile != 'quality-preview-1' }}
        run: bash iOS/Scripts/test-picker-ui.sh
      - name: Upload approved unsigned IPA after required gates pass
        uses: actions/upload-artifact@v7
        with:
          name: GameLingo-unsigned-IPA
          path: iOS/build/GameLingo-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Save compiled native dependencies
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && hashFiles('iOS/.build/native/iphoneos-arm64/prefix/lib/libcrypto.a') != ''
        uses: actions/cache/save@v5
        with:
          path: |
            iOS/.build/sources
            iOS/.build/native
            iOS/.build/lib
            iOS/.build/include
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GameLingo-iOS-validation
          path: |
            prepare.log
            iOS/build/logs/
            iOS/build/*.xcresult
            iOS/.build/dependency-sources.json
          if-no-files-found: warn
          retention-days: 14
