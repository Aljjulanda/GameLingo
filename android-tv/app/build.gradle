plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}
android {
    namespace 'dev.gamelingo.tv'
    compileSdk 34
    defaultConfig {
        applicationId project.hasProperty('labBuild') ? 'dev.gamelingo.tv.lab' : 'dev.gamelingo.tv'
        manifestPlaceholders = [appLabel: project.hasProperty('labBuild') ? 'GameLingo TV Lab' : 'GameLingo TV']
        minSdk 26
        targetSdk 32
        versionCode 9
        versionName '0.6.1'
        testInstrumentationRunner project.hasProperty('advancedCanvasTest') ? 'dev.gamelingo.tv.AdvancedCanvasRunner' : project.hasProperty('tvNetworkTest') ? 'dev.gamelingo.tv.NetworkRunner' : 'dev.gamelingo.tv.CanvasRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    // Reuse the installed TV build's signing identity for a data-preserving update.
    // The keystore stays outside Git. Standard Android debug key passwords only.
    if (System.getenv('GAMELINGO_TV_KEYSTORE')) {
        signingConfigs.debug {
            storeFile file(System.getenv('GAMELINGO_TV_KEYSTORE'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
