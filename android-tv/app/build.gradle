plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}
android {
    namespace 'dev.gamelingo.tv'
    compileSdk 34
    defaultConfig {
        applicationId project.hasProperty('labBuild') ? 'dev.gamelingo.tv.lab' : 'dev.gamelingo.tv'
        manifestPlaceholders = [appLabel: project.hasProperty('labBuild') ? 'GameLingo TV Lab' : 'GameLingo TV']
        minSdk 26
        targetSdk 32
        versionCode 12
        versionName '0.8.0-preview.1'
        testInstrumentationRunner project.hasProperty('qrTest') ? 'dev.gamelingo.tv.BootstrapRunner' : project.hasProperty('rtl021Test') ? 'dev.gamelingo.tv.Rtl021Runner' : project.hasProperty('advancedCanvasTest') ? 'dev.gamelingo.tv.AdvancedCanvasRunner' : project.hasProperty('tvNetworkTest') ? 'dev.gamelingo.tv.NetworkRunner' : 'dev.gamelingo.tv.CanvasRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '1600m'
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'gamelingo.renderOutput', file("$buildDir/reports/quality-rendering").absolutePath
        }
    }
    // Reuse the installed TV build's signing identity for a data-preserving update.
    // The keystore stays outside Git. Standard Android debug key passwords only.
    if (System.getenv('GAMELINGO_TV_KEYSTORE')) {
        signingConfigs.debug {
            storeFile file(System.getenv('GAMELINGO_TV_KEYSTORE'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    // Matches the existing API34 / AGP8.5 build; test-only native Canvas runtime.
    testImplementation 'org.robolectric:robolectric:4.13'
}
